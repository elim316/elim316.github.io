<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="apple-squircle-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d1d1f" />
      <stop offset="52%" stop-color="#111318" />
      <stop offset="100%" stop-color="#003870" />
    </linearGradient>
    <linearGradient id="apple-squircle-rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="apple-core-grad" x1="18" y1="18" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>
  </defs>
  <!-- macOS / Apple Silicon Continuous Squircle Chassis -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#apple-squircle-bg)" stroke="url(#apple-squircle-rim)" stroke-width="2" />
  <!-- Top Specular Glass Arc -->
  <path d="M 17 4.5 H 47 C 54 4.5 58.5 9 59.5 16 C 56 10 49 7.5 32 7.5 C 15 7.5 8 10 4.5 16 C 5.5 9 10 4.5 17 4.5 Z" fill="#ffffff" fill-opacity="0.09" />
  <!-- Precision Silicon Die & Neural Cloud Pins -->
  <g stroke="#93c5fd" stroke-width="2.2" stroke-linecap="round">
    <line x1="26" y1="12" x2="26" y2="19" />
    <line x1="38" y1="12" x2="38" y2="19" />
    <line x1="26" y1="45" x2="26" y2="52" />
    <line x1="38" y1="45" x2="38" y2="52" />
    <line x1="12" y1="26" x2="19" y2="26" />
    <line x1="12" y1="38" x2="19" y2="38" />
    <line x1="45" y1="26" x2="52" y2="26" />
    <line x1="45" y1="38" x2="52" y2="38" />
  </g>
  <!-- Outer Neural Die Ring -->
  <rect x="18" y="18" width="28" height="28" rx="7" fill="#0b1322" stroke="url(#apple-core-grad)" stroke-width="2.2" />
  <!-- Inner Glowing Apple-Style Neural Core & Orbit -->
  <rect x="24.5" y="24.5" width="15" height="15" rx="4" fill="url(#apple-core-grad)" />
  <circle cx="32" cy="32" r="2.6" fill="#ffffff" />
</svg>
